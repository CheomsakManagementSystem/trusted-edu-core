name: Account security validation

on:
  push:
    branches:
      - fix/account-security-integrity-20260809
  pull_request:
    branches:
      - develop

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: AIzaSyDUMMY000000000000000000000000000000
      VITE_FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: test-project
      VITE_FIREBASE_STORAGE_BUCKET: test-project.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: 123456789012
      VITE_FIREBASE_APP_ID: 1:123456789012:web:0123456789abcdef012345
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Validate Firebase Functions syntax
        working-directory: functions
        run: |
          npm ci
          node --check index.js
      - name: Guard account deletion invariants
        run: |
          node <<'NODE'
          const fs = require('fs');
          const fn = fs.readFileSync('functions/index.js', 'utf8');
          const client = fs.readFileSync('src/services/accountDeletionService.ts', 'utf8');
          const managedStart = client.indexOf('export const deleteManagedUserCompletely');
          const authDelete = client.indexOf('await deleteAuthUserByUid(uid);', managedStart);
          const firestorePurge = client.indexOf('await purgeUserFirestoreData(uid);', managedStart);
          const checks = [
            [fn.includes('verifyIdToken(token, true)'), 'Firebase ID token verification missing'],
            [fn.includes('profileRole !== ADMIN_ROLE'), 'ADMIN profile verification missing'],
            [fn.includes('uid === actor.uid'), 'admin self-delete guard missing'],
            [!fn.includes('req.method !== "POST" && req.method !== "GET"'), 'GET delete endpoint still enabled'],
            [client.includes('Authorization: `Bearer ${idToken}`'), 'Authorization header missing'],
            [client.includes('resolveUniqueUserProfileRef'), 'custom profile resolution missing'],
            [!client.includes('query(collection(db, "reports"), where("uid", "==", uid))'), 'uploader reports are still deleted'],
            [managedStart >= 0 && authDelete > managedStart && firestorePurge > authDelete, 'managed user deletion order is unsafe'],
          ];
          const failures = checks.filter(([ok]) => !ok).map(([, message]) => message);
          if (failures.length) {
            console.error(failures.join('\n'));
            process.exit(1);
          }
          NODE
