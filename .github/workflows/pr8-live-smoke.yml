name: PR 8 live smoke

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PROD_URL: https://www.cheomsak.com
      LOCAL_URL: http://127.0.0.1:4173
      VITE_FIREBASE_API_KEY: AIzaSyDUMMY000000000000000000000000000000
      VITE_FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: test-project
      VITE_FIREBASE_STORAGE_BUCKET: test-project.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: 123456789012
      VITE_FIREBASE_APP_ID: 1:123456789012:web:0123456789abcdef012345
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install and build PR
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Start production preview
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/vite-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vite-preview.log
          exit 1

      - name: Install Playwright in isolated directory
        run: |
          mkdir -p /tmp/live-smoke
          cd /tmp/live-smoke
          npm init -y >/dev/null 2>&1
          npm install --silent @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run Chromium smoke tests
        run: |
          cat >/tmp/live-smoke/smoke.cjs <<'EOF'
          const { chromium } = require('@playwright/test');

          const local = process.env.LOCAL_URL;
          const prod = process.env.PROD_URL;
          const failures = [];
          const results = [];

          const routeCases = [
            ['/', 'SMART REPORT SYSTEM'],
            ['/login', '로그인'],
            ['/signup', '회원가입'],
            ['/guide', '이용 가이드'],
          ];

          async function inspectPage(browser, base, label, path, expected, viewport) {
            const page = await browser.newPage({ viewport });
            const pageErrors = [];
            const consoleErrors = [];
            page.on('pageerror', (error) => pageErrors.push(String(error.message || error)));
            page.on('console', (message) => {
              if (message.type() === 'error') consoleErrors.push(message.text());
            });

            const started = Date.now();
            const response = await page.goto(base + path, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForLoadState('networkidle', { timeout: 5000 }).catch(() => {});
            await page.waitForTimeout(400);

            const body = await page.locator('body').innerText().catch(() => '');
            const status = response?.status() ?? 0;
            const metrics = await page.evaluate(() => {
              const nav = performance.getEntriesByType('navigation')[0];
              const paint = performance.getEntriesByType('paint');
              const fcp = paint.find((entry) => entry.name === 'first-contentful-paint');
              const scripts = performance.getEntriesByType('resource').filter((entry) => entry.initiatorType === 'script');
              return {
                domContentLoaded: nav ? Math.round(nav.domContentLoadedEventEnd) : null,
                fcp: fcp ? Math.round(fcp.startTime) : null,
                scriptCount: scripts.length,
                scriptTransferBytes: Math.round(scripts.reduce((sum, entry) => sum + (entry.transferSize || 0), 0)),
                scrollWidth: document.documentElement.scrollWidth,
                innerWidth: window.innerWidth,
              };
            });

            const record = {
              label, path, viewport: `${viewport.width}x${viewport.height}`, status,
              finalUrl: page.url(), wallMs: Date.now() - started, ...metrics,
              pageErrors, consoleErrors,
            };
            results.push(record);
            console.log('SMOKE_RESULT ' + JSON.stringify(record));

            if (status >= 400 || status === 0) failures.push(`${label} ${path}: HTTP ${status}`);
            if (!body.includes(expected)) failures.push(`${label} ${path}: expected text not found: ${expected}`);
            if (pageErrors.length) failures.push(`${label} ${path}: page errors: ${pageErrors.join(' | ')}`);
            if (metrics.scrollWidth > metrics.innerWidth + 2) failures.push(`${label} ${path}: horizontal overflow ${metrics.scrollWidth} > ${metrics.innerWidth}`);
            await page.close();
          }

          async function inspectProtected(browser, base, path) {
            const page = await browser.newPage({ viewport: { width: 1365, height: 768 } });
            const pageErrors = [];
            page.on('pageerror', (error) => pageErrors.push(String(error.message || error)));
            await page.goto(base + path, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForTimeout(1000);
            const body = await page.locator('body').innerText().catch(() => '');
            const finalUrl = page.url();
            const redirected = finalUrl.includes('/login') || body.includes('로그인');
            const record = { label: 'local-protected', path, finalUrl, redirected, pageErrors };
            results.push(record);
            console.log('PROTECTED_RESULT ' + JSON.stringify(record));
            if (!redirected) failures.push(`local ${path}: unauthenticated user was not redirected to login`);
            if (pageErrors.length) failures.push(`local ${path}: page errors: ${pageErrors.join(' | ')}`);
            await page.close();
          }

          async function inspectProductionInvalidLogin(browser) {
            const page = await browser.newPage({ viewport: { width: 1365, height: 768 } });
            const pageErrors = [];
            page.on('pageerror', (error) => pageErrors.push(String(error.message || error)));
            await page.goto(prod + '/login', { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.locator('input[type="email"]').fill(`smoke-${Date.now()}@example.invalid`);
            await page.locator('input[type="password"]').fill('SmokeTest-NotARealPassword-2026');
            await page.getByRole('button', { name: '로그인' }).click();
            await page.waitForTimeout(1800);
            const body = await page.locator('body').innerText();
            const showedError = body.includes('비밀번호가 일치하지 않습니다') || body.includes('로그인 중 오류가 발생했습니다');
            const record = { label: 'prod-invalid-login', showedError, pageErrors };
            results.push(record);
            console.log('LOGIN_RESULT ' + JSON.stringify(record));
            if (!showedError) failures.push('production invalid login did not show a user-facing error');
            if (pageErrors.length) failures.push(`production invalid login page errors: ${pageErrors.join(' | ')}`);
            await page.close();
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              for (const [path, expected] of routeCases) {
                await inspectPage(browser, local, 'pr-build-desktop', path, expected, { width: 1365, height: 768 });
              }
              for (const [path, expected] of [['/', 'SMART REPORT SYSTEM'], ['/login', '로그인']]) {
                await inspectPage(browser, local, 'pr-build-mobile', path, expected, { width: 390, height: 844 });
              }
              for (const path of ['/dashboard', '/admin', '/admin/class-manager', '/admin/master']) {
                await inspectProtected(browser, local, path);
              }
              for (const [path, expected] of [['/', 'SMART REPORT SYSTEM'], ['/login', '로그인']]) {
                await inspectPage(browser, prod, 'prod-baseline', path, expected, { width: 1365, height: 768 });
              }
              await inspectProductionInvalidLogin(browser);

              console.log('SMOKE_SUMMARY ' + JSON.stringify({ totalChecks: results.length, failureCount: failures.length, failures }));
              if (failures.length) {
                console.error(failures.join('\n'));
                process.exitCode = 1;
              }
            } finally {
              await browser.close();
            }
          })();
          EOF
          cd /tmp/live-smoke
          node smoke.cjs
