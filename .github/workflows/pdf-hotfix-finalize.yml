name: Finalize PDF hotfix

on:
  push:
    branches:
      - hotfix/pdf-parser-stability-20260809

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Harden mixed score recovery
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/lib/pdfProcessorHotfix.ts')
          text = path.read_text()
          old = '''export const repairParsedScores = (parsed: ParsedPdfData): ParsedPdfData => {\n  if (hasScoreIntegrity(parsed.scores) && looksLikeNormalizedScale(parsed.scores)) {\n    return parsed;\n  }\n\n  const recovered = parseScoreRowsFromRawText(parsed.rawText);\n  if (!recovered) return parsed;\n\n  return {\n'''
          new = '''export const repairParsedScores = (parsed: ParsedPdfData): ParsedPdfData => {\n  const recovered = parseScoreRowsFromRawText(parsed.rawText);\n  if (!recovered) return parsed;\n\n  const alreadyMatches = REQUIRED_SCORE_KEYS.every((key) =>\n    parsed.scores[key] === recovered.scores[key] &&\n    parsed.averageScores[key] === recovered.averageScores[key] &&\n    parsed.convertedScores[key] === recovered.convertedScores[key],\n  );\n\n  if (alreadyMatches && parsed.scoreParse?.confidence !== \"low\") {\n    return parsed;\n  }\n\n  return {\n'''
          if text.count(old) != 1:
              raise SystemExit(f'repair function anchor mismatch: {text.count(old)}')
          path.write_text(text.replace(old, new, 1))

          test_path = Path('src/lib/pdfProcessorHotfix.test.ts')
          tests = test_path.read_text()
          anchor = '''  it(\"accepts a real weighted total when rounded converted scores differ by 0.6\", () => {\n'''
          addition = '''  it(\"repairs partially mixed rubric maximums and normalized scores\", () => {\n    const parsed: ParsedPdfData = {\n      name: \"방승혁\",\n      className: \"분당 수6\",\n      studentId: \"\",\n      phoneSuffix: \"\",\n      writtenAt: \"2026.07.15\",\n      essayTopic: \"성균관대 불평등\",\n      grade: \"B+\",\n      reviewer: \"최지영T\",\n      feedback: \"자료 분석을 다시할 필요가 있습니다.\",\n      scores: {\n        reading: 20,\n        comprehension: 88,\n        problemUnderstanding: 89,\n        organization: 20,\n        expression: 86,\n        total: 88.2,\n      },\n      averageScores: converted([89, 86, 86, 88, 87]),\n      convertedScores: converted([87, 26, 18, 85, 9]),\n      scoreParse: { confidence: \"medium\", method: \"layout-order\", warnings: [] },\n      rawText: \"독해력 제시문 내용에 대한 독해 능력 (20점 만점) 89 87 18 내용 이해력 문제에 따른 핵심 내용 이해력 (30점 만점) 88 86 26 문제 이해력 문제 요구조건 이해 능력 (20점 만점) 89 86 18 구성력 글 전체 구조의 구성 능력 (20점 만점) 88 85 18 표현력 맞춤법 주술 호응 등 표현력 (10점 만점) 86 87 9 총점 88.2 등급 B+\",\n    };\n\n    const repaired = repairParsedScores(parsed);\n\n    expect(repaired.scores).toMatchObject({\n      reading: 89,\n      comprehension: 88,\n      problemUnderstanding: 89,\n      organization: 88,\n      expression: 86,\n      total: 88.2,\n    });\n    expect(repaired.averageScores).toMatchObject({\n      reading: 87,\n      comprehension: 86,\n      problemUnderstanding: 86,\n      organization: 85,\n      expression: 87,\n    });\n    expect(repaired.convertedScores).toMatchObject({\n      reading: 18,\n      comprehension: 26,\n      problemUnderstanding: 18,\n      organization: 18,\n      expression: 9,\n      total: 89,\n    });\n  });\n\n'''
          if tests.count(anchor) != 1:
              raise SystemExit(f'test anchor mismatch: {tests.count(anchor)}')
          test_path.write_text(tests.replace(anchor, addition + anchor, 1))
          PY

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Commit final hardening
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/pdfProcessorHotfix.ts src/lib/pdfProcessorHotfix.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: harden mixed PDF score recovery"
          git push origin HEAD:hotfix/pdf-parser-stability-20260809
