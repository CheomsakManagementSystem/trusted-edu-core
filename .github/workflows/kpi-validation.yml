name: KPI validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck --if-present

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Package source for verification
        if: always()
        run: tar --exclude=.git -czf /tmp/trusted-edu-core-source.tar.gz .

      - name: Upload source artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trusted-edu-core-source
          path: /tmp/trusted-edu-core-source.tar.gz
          retention-days: 1
