name: KPI validation

on:
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_FIREBASE_API_KEY: AIzaSyDUMMY000000000000000000000000000000
      VITE_FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: test-project
      VITE_FIREBASE_STORAGE_BUCKET: test-project.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: "123456789012"
      VITE_FIREBASE_APP_ID: 1:123456789012:web:0123456789abcdef012345
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply render performance patch
        if: github.event_name == 'pull_request' && github.head_ref == 'perf/develop-latency-20260808'
        run: |
          sed -i 's/^const handleRefreshReadStatus/  const handleRefreshReadStatus/' src/pages/Admin/UploadDashboard.tsx
          node scripts/apply-render-performance-patch.mjs

      - name: Commit render performance patch
        if: github.event_name == 'pull_request' && github.head_ref == 'perf/develop-latency-20260808'
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Admin/UploadDashboard.tsx src/pages/Admin/ClassManager.tsx
          git commit -m "perf: defer archive load and skip offscreen rendering"
          git push origin HEAD:${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
