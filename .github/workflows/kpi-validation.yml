name: KPI bootstrap validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_FIREBASE_API_KEY: AIzaSyDUMMY000000000000000000000000000000
      VITE_FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: test-project
      VITE_FIREBASE_STORAGE_BUCKET: test-project.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: "123456789012"
      VITE_FIREBASE_APP_ID: 1:123456789012:web:0123456789abcdef012345
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Apply KPI instrumentation
        shell: bash
        run: |
          cat .kpi-patch/part-* | base64 -d > /tmp/kpi.patch
          git apply --check /tmp/kpi.patch
          git apply /tmp/kpi.patch
          rm -rf .kpi-patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add KPI performance instrumentation"
          git push origin HEAD:develop

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
