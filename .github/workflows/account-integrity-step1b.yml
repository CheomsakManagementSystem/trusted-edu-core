name: Account integrity Step 1B

on:
  push:
    branches:
      - fix/account-security-integrity-20260809

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: AIzaSyDUMMY000000000000000000000000000000
      VITE_FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: test-project
      VITE_FIREBASE_STORAGE_BUCKET: test-project.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: 123456789012
      VITE_FIREBASE_APP_ID: 1:123456789012:web:0123456789abcdef012345
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Guard managed-user invariants
        run: |
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('src/services/masterAdminService.ts', 'utf8');
          const checks = [
            [text.includes('resolveUniqueManagedUserRef'), 'unique managed user resolver missing'],
            [text.includes('type DocumentReference'), 'DocumentReference typing missing'],
            [text.includes('const MAX_BATCH_WRITES = 400'), 'safe batch size missing'],
            [text.includes('const userRef = await resolveUniqueManagedUserRef(uid);'), 'managed updates do not resolve actual profile document'],
            [!text.includes('batch.set(doc(db, "users", uid)'), 'student ID cascade still assumes users/{uid}'],
            [text.includes('for (const docs of chunkBy(snap.docs, MAX_BATCH_WRITES))'), 'student ID cascade is not chunked'],
            [text.includes('chunkBy(uniqueIds, 30)'), 'notification in-query batching regressed'],
            [text.includes('for (const docs of chunkBy(reportDocs, 400))'), 'notification write batching regressed'],
          ];
          const failures = checks.filter(([ok]) => !ok).map(([, message]) => message);
          if (failures.length) {
            console.error(failures.join('\n'));
            process.exit(1);
          }
          NODE
